name: PPPMTL One-Time Formatter

# A targeted, one-shot source formatting repair for 2026-10-28. The push
# trigger matches ONLY this workflow file, preventing a bot push loop.
# Future changes elsewhere do not dispatch formatting automatically.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pppmtl-onetime-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format only the files reported by CI Prettier
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/check-sql-migrations.mjs
            src/components/order/item-sheet.tsx
            src/lib/integration/__tests__/clover.test.ts
            src/lib/integration/providers/clover/site-groups.ts
            src/lib/orders/__tests__/clover-fulfillment-worker.test.ts
            src/lib/orders/__tests__/postgres-transactions.test.ts
            src/lib/orders/clover-fulfillment-worker.server.ts
            src/lib/orders/postgres-transactions.server.ts
            src/routes/menu.tsx
          )
          bunx prettier --write "${files[@]}"
          if git diff --quiet; then
            echo "Targeted files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "style(pppmtl): format menu, Clover and order files flagged by CI"
          # Never force-push or overwrite other agents' commits.
          git push origin HEAD:main
