name: PPPMTL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pppmtl-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Typecheck, lint, tests and server build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NITRO_PRESET: node-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      # Vite's TanStack router plugin generates the typed route tree during build.
      # Generate the routes before tsc checks new file-based routes.
      - name: Build Nitro Node server and generate route types
        run: bun run build
      - name: Validate TypeScript
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test security, order, brand and integration behavior
        run: bun run test

  database-isolation:
    name: PostgreSQL schema and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ppp-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for broken or duplicated SQL migration files
        run: |
          node scripts/check-sql-migrations.mjs
          node --test scripts/__tests__/check-sql-migrations.test.mjs
      - name: Install PostgreSQL client if needed
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Apply PostgreSQL schema and atomic payment operations
        env:
          PGPASSWORD: ppp-ci-only-password
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/migrations/0001_ppp_orders.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/migrations/0002_ppp_atomic_payments.sql
      - name: Create limited test application role
        env:
          PGPASSWORD: ppp-ci-only-password
        shell: bash
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ppp_ci_role LOGIN PASSWORD 'ppp-ci-tenant-test-password';
          GRANT USAGE ON SCHEMA ppp TO ppp_ci_role;
          GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA ppp TO ppp_ci_role;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA ppp TO ppp_ci_role;
          GRANT EXECUTE ON FUNCTION ppp.create_order_once(text,text,text,text,jsonb,text) TO ppp_ci_role;
          GRANT EXECUTE ON FUNCTION ppp.record_verified_clover_payment(text,text,text,text,text) TO ppp_ci_role;
          SQL
      - name: Prove cross-tenant RLS and atomic payment idempotency
        env:
          PGPASSWORD: ppp-ci-tenant-test-password
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U ppp_ci_role -d postgres -v ON_ERROR_STOP=1 -f db/tests/tenant-isolation.sql
          psql -h 127.0.0.1 -U ppp_ci_role -d postgres -v ON_ERROR_STOP=1 -f db/tests/atomic-payments.sql
